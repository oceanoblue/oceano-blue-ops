# Fly.io config for the Oceano ARW conversion worker.
# Deploy:
#   cd worker
#   fly launch --copy-config --no-deploy   # first time only
#   fly secrets set SUPABASE_URL=https://...supabase.co \
#                   SUPABASE_SERVICE_KEY=eyJ... \
#                   WORKER_SECRET=$(openssl rand -hex 32)
#   fly deploy

app = "oceano-arw-worker"
primary_region = "iad"   # change to your nearest Fly region

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"     # save money when idle
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512        # ARW decode wants a little headroom

[deploy]
  release_command = "node -v"

[env]
  NODE_ENV = "production"
