name: DB Migrate (manual)

# Manual-only migration runner for the LIVE Supabase project.
# - Never runs on push or pull_request.
# - No secrets live in the repo; everything comes from GitHub Actions /
#   Environment secrets (see docs/DB_MIGRATIONS_RUNBOOK.md).
# - A typed confirmation + dry-run-by-default guard against running against the
#   wrong project or applying changes unintentionally.

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Type the target Supabase project ref to confirm. Must match the SUPABASE_PROJECT_REF secret, or the run aborts."
        required: true
        type: string
      dry_run:
        description: "Preview only (supabase db push --dry-run). Uncheck to actually apply migrations."
        required: true
        type: boolean
        default: true

# Never allow two migration runs at once.
concurrency:
  group: db-migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Use a protected GitHub Environment so you can require reviewers / restrict
    # who can run this and scope the secrets to production.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — confirm target project ref
        env:
          EXPECTED: ${{ secrets.SUPABASE_PROJECT_REF }}
          PROVIDED: ${{ github.event.inputs.confirm_project_ref }}
        run: |
          if [ -z "$EXPECTED" ]; then
            echo "::error::SUPABASE_PROJECT_REF secret is not set. Configure it before running."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set."
            exit 1
          fi
          if [ "$PROVIDED" != "$EXPECTED" ]; then
            echo "::error::Confirmation does not match the configured SUPABASE_PROJECT_REF. Aborting to avoid the wrong project."
            exit 1
          fi
          echo "Target project ref confirmed. dry_run=${{ github.event.inputs.dry_run }}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: List migrations (local vs remote)
        run: supabase migration list

      - name: Dry run — preview pending migrations
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "Previewing pending migrations (no changes applied)..."
          supabase db push --dry-run

      - name: Apply migrations (supabase db push)
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          echo "Applying pending migrations to the confirmed project..."
          supabase db push

      - name: Post-apply migration list
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: supabase migration list
