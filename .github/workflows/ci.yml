name: CI

# Quality gate on every PR and on pushes to main. Typecheck + tests + build are
# required (the DB-types repair cleared the tsc baseline to zero and the build now
# enforces types). Lint and dependency security checks also block failures.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Placeholder public env so the client bundle builds without secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://example.com

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dependency audit
        run: npm audit --audit-level=high

  # Photo edit-engine grade-math invariants (pure NumPy/OpenCV). These guard the
  # tuning loop (docs/HANDOFF-photo-quality.md) so each worker-edit change ships
  # on a green math floor even though real renders can't run in CI.
  edit-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        working-directory: worker-edit
        run: pip install -r requirements.txt pytest

      - name: Grade-math tests
        working-directory: worker-edit
        run: pytest -q
