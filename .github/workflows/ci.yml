name: CI

# Quality gate on every PR and on pushes to main. Tests + build are required;
# typecheck + lint are informational for now (the DB-types repair that clears the
# ~121 tsc baseline is tracked separately — flip these to required once it lands).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Placeholder public env so the client bundle builds without secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://example.com

      - name: Typecheck (informational)
        run: npm run typecheck
        continue-on-error: true

      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true

      - name: Dependency audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
